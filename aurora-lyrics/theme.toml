# Aurora — full-screen lyrics, half artwork / half lyrics: a big rounded cover on the left, large Figtree lines on the right, all lit by the
# artwork's own colours (cover backdrop + cover accent). Heavier glow, a softer blur falloff and a slow springy cascade set it apart from Blur.

[meta]
id = "aurora-lyrics"
name = "Aurora"
extends = "blur"
scheme = "dark"

[colors]
derive = true             # everything not listed is computed from bg / fg; the light palette is generated
bg = "#0C0A14"
fg = "#F1ECFF"
dim = "#9A90BD"
accent = "cover"
play_bg = "#FFFFFF"
np_on = "#0C0A14"

[fonts]
ui = "Figtree"
fallbacks = ["IBM Plex Sans Arabic", "Noto Sans Arabic", "Noto Sans CJK JP", "Noto Color Emoji"]

[shape]
cover = 14
hero = 20

[lyrics]
font = "ui"
layout = "split"          # half artwork, half lyrics
align = "start"
backdrop = "cover"        # animated artwork colours fill the page
active_size = 50
size = 34
line_gap = 30
blur = 1.0
glow = 1.2
spring = 0.8
cascade = 0.08
cover_radius = 28
cover_shadow = true
chrome = "capsule"
